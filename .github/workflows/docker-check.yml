name: Docker build and smoke check

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static assets
        run: node scripts/check-dist.mjs
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker compose build
      - name: Start production container
        run: docker compose up -d --wait --wait-timeout 90
      - name: Check Nginx configuration
        run: docker compose exec -T web nginx -t
      - name: Check health, tools and assets
        run: node scripts/smoke-docker.mjs http://127.0.0.1:8080
      - name: Build from source
        run: docker build -f Dockerfile.build -t xuandao-yishu:source-check .
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Stop container
        if: always()
        run: docker compose down
